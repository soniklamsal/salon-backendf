# Render Blueprint. Point Render at this repo (New -> Blueprint) and it creates
# the web service and the database below together.
#
# Managed Postgres is declared under this top-level `databases:` key -- NOT as a
# `type: pserv` service. A `pserv` is a private Docker service with no image
# here; declaring the database that way fails to deploy and leaves the web
# service's `fromDatabase` reference pointing at nothing.
databases:
  - name: salon-db
    plan: free  # Free Postgres sleeps and is capped; raise for real traffic.

services:
  # Django Backend Web Service
  - type: web
    name: salon-backend
    runtime: python
    plan: free  # Change to 'starter' or higher for production
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # ALLOWED_HOSTS already includes this service's own onrender.com host
      # automatically (settings reads RENDER_EXTERNAL_HOSTNAME). Set this only
      # to add a custom domain, e.g. api.ajunisexsalon.com.
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      # The frontend origins the browser calls this API from. MUST include the
      # live site, both apex and www, or the booking form cannot reach the API
      # once a customer is on the real domain:
      #   https://ajunisexsalon.com,https://www.ajunisexsalon.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # This service's own public URL, for building absolute links (emails,
      # screenshots) when no request is in hand. e.g.
      #   https://salon-backend.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: salon-db
          property: connectionString
      # Shared with the frontend, which signs the session tokens this API
      # verifies. It must be byte-for-byte the same value as SALON_AUTH_SECRET
      # in Vercel: if the two differ, sign-in still appears to work and every
      # booking is recorded anonymously, with nothing in the browser to say so.
      # `sync: false` rather than `generateValue: true` for exactly that reason
      # -- a generated value could never match the frontend's.
      - key: SALON_AUTH_SECRET
        sync: false
      # Recorded so the admin can tell which Google project the accounts belong
      # to. Not used to verify anything here; Google is verified on the frontend.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Signs the time-limited URLs for private payment screenshots.
      - key: CLOUDINARY_AUTH_TOKEN_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: SALON_NOTIFY_EMAILS
        sync: false
      # Admin bootstrap. build.sh creates (or refreshes) this superuser on each
      # deploy from these three, so the login always exists on a fresh database.
      # Kept out of the repo -- set them in the dashboard. Leave them unset and
      # build.sh simply skips the step.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
