# Keeps the Render free-tier backend from spinning down.
#
# Render puts a free web service to sleep after ~15 minutes with no traffic;
# the next visitor then waits ~50s for it to cold-start. This pings the health
# endpoint every 10 minutes so the service never idles out — which for a single
# service stays inside Render's free 750 instance-hours/month.
#
# Caveats worth knowing:
#   * GitHub only runs scheduled workflows on a best effort basis and can delay
#     them under load, so the odd gap may exceed 15 min. For guaranteed uptime,
#     pair this with a free external monitor (UptimeRobot, cron-job.org) or move
#     the backend to a paid Render plan.
#   * GitHub disables scheduled workflows on a repo with no commits for 60 days.
#   * Update the URL below if the backend moves to a custom domain.
name: Keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (UTC)
  workflow_dispatch: {} # allow a manual run from the Actions tab

# Never let two pings overlap, and don't queue a backlog if a run is delayed.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: |
          # --max-time 90 gives a sleeping instance room to cold-start; retries
          # absorb the timeout of that first wake-up request.
          curl -fsS --max-time 90 \
            --retry 4 --retry-delay 15 --retry-all-errors \
            https://salon-backendf.onrender.com/api/v1/health/
